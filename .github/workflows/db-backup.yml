name: Backup diário do banco

# Roda todo dia às 6h UTC (3h em Brasília) e também pode ser disparado
# manualmente pela aba "Actions" do GitHub, caso precise de um backup
# extra fora do horário programado.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instala cliente do Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Gera o dump do banco
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          mkdir -p backup
          # remove espaços/quebras de linha acidentais que às vezes entram
          # ao colar o secret na UI do GitHub
          CLEAN_URL=$(printf '%s' "$DATABASE_URL_UNPOOLED" | tr -d '\r\n' | xargs)
          pg_dump "$CLEAN_URL" --format=custom --file=backup/petit-de-lamour-$(date +%Y-%m-%d).dump

      - name: Guarda o dump como artefato
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 90
